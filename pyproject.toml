[project]
name = "agentic-ai"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "karthick413", email = "karthickrenuga413@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "pydantic[email]>=2.14.3",
    "python-dotenv>=1.2.4",
]

[project.scripts]
agentic-ai = "agentic_ai:main"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]
